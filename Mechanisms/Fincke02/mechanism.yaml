description: |-
  Test mechanism based on "Chemical Kinetics of Methane Pyrolysis in Microwave
  Plasma at Atmospheric Pressure".
  Species NASA7 polynomials reference: https://respecth.elte.hu/burcat.php
  Transport data: https://ignis.usc.edu:80/Mechanisms/USC-Mech%20II/USC_Mech%20II.htm
units: {length: cm, time: s, quantity: mol, activation-energy: kJ/mol}

phases:
- name: gas
  thermo: ideal-gas
  elements: [Ar, H, C]
  species: [Ar, H2, H,  C, C(s), Csoot, CH, CH2, CH2(S), CH3, CH4,
            C2, C2H, C2H2, C2H3, C2H4, C2H5, C2H6, C3H2, 
            C3H3, C3H4A, C3H4P, C3H5A, C3H6, C4H2, H2CCCCH,
            C4H4(13), C4H5(n), C4H5(i), C4H6(13), C4H8T2, C6H5, C6H6]
  kinetics: gas
  transport: mixture-averaged
  state: {T: 300.0, P: 1 atm}
  explicit-third-body-duplicates: mark-duplicate

